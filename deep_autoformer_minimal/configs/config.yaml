
# Default configuration (edit paths before running)
data:
  csv_path: data/data.csv   # must exist
  seq_len: 96
  label_len: 48
  pred_len: 24
  target_col: target
  feature_cols: []

model:
  d_model: 256
  n_heads: 4
  e_layers: 2
  d_layers: 1
  d_ff: 512
  top_k: 4
  kernel_size: 25
  dropout: 0.1
  add_deep_mlp: true

train:
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 64
  epochs: 20
  train_ratio: 0.7
  val_ratio: 0.15
  patience: 5
  device: mps  # Options: auto, mps (Mac GPU), cuda (NVIDIA GPU), cpu
