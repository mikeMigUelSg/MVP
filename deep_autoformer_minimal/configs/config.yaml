data:
  csv_path: data/data.csv
  seq_len: 288        # ~3 dias de contexto (3×96). Bom equilíbrio p/ day-ahead
  label_len: 48       # parte “conhecida” do decoder; metade do horizonte
  pred_len: 96        # 24 h à frente (15 min)
  target_col: target
  # Features temporais: encoding cíclico do dia da semana
  feature_cols: [dayofweek_sin, dayofweek_cos]

model:
  d_model: 512        # 128 funciona; 256 tende a melhorar sem pesar muito
  n_heads: 8
  e_layers: 2
  d_layers: 1
  d_ff: 512
  top_k: 5            # nº de defasagens dominantes (mantém 3–5)
  kernel_size: 13     # janela de média móvel da decomposição (recomendado p/ 15 min)
  dropout: 0.1
  add_deep_mlp: true  # “Deep-Autoformer”: 1 MLP extra melhora os resultados

train:
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 128
  epochs: 30
  train_ratio: 0.7
  val_ratio: 0.15
  patience: 5
  device: mps         # usa “cuda” se tiveres NVIDIA
