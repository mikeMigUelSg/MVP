data:
  csv_path: data/c2024_autoformer.csv
  seq_len: 288
  label_len: 48
  pred_len: 96
  target_col: target
  feature_cols: []
  # Opcional: Especificar intervalo de datas para treino
  start_date: "2025-01-01"  # Início dos dados (formato YYYY-MM-DD)
  end_date: "2025-03-01"    # Fim dos dados (formato YYYY-MM-DD)
model:
  d_model: 256
  n_heads: 4
  e_layers: 2
  d_layers: 1
  d_ff: 512
  top_k: 5
  kernel_size: 13
  dropout: 0.1
  add_deep_mlp: true
train:
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 512
  epochs: 20
  train_ratio: 0.7
  val_ratio: 0.15
  patience: 5
  device: mps
  num_workers: 4
  compile_model: false
