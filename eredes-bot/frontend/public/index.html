<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2196f3" />
    <meta name="description" content="Simulação inteligente de faturas de eletricidade com dados reais do E-REDES" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Meta tags para SEO -->
    <meta property="og:title" content="E-REDES Bot - Simulação de Faturas" />
    <meta property="og:description" content="Analise o seu consumo energético com dados reais do E-REDES" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

    <!-- PWA Meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="E-REDES Bot" />

    <title>E-REDES Bot - Simulação de Faturas Inteligente</title>

    <style>
      /* Critical CSS para evitar FOUC */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      /* Loading screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #loading-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loading-content {
        text-align: center;
        color: white;
      }

      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #fff;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .loading-title {
        margin: 0 0 10px;
        font-size: 24px;
        font-weight: 600;
      }

      .loading-subtitle {
        margin: 0;
        opacity: 0.8;
        font-size: 16px;
      }

      code {
        font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
          monospace;
      }

      /* Dark theme support */
      @media (prefers-color-scheme: dark) {
        .theme-dark {
          --primary-bg: #1a1a1a;
          --secondary-bg: #2d2d2d;
          --text-primary: #ffffff;
          --text-secondary: #b0b0b0;
        }
      }

      /* Light theme */
      .theme-light {
        --primary-bg: #ffffff;
        --secondary-bg: #f5f5f5;
        --text-primary: #333333;
        --text-secondary: #666666;
      }

      /* Prevent flash of unstyled content */
      #root {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }

      #root.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>¡ E-REDES Bot</h1>
        <p>Esta aplicação necessita de JavaScript para funcionar.</p>
        <p>Por favor, ative o JavaScript no seu navegador e recarregue a página.</p>
      </div>
    </noscript>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <h1 class="loading-title">¡ E-REDES Bot</h1>
        <p class="loading-subtitle">Carregando simulador inteligente...</p>
      </div>
    </div>

    <!-- React App Root -->
    <div id="root"></div>

    <script>
      // Remove loading screen when React app loads
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          const loadingScreen = document.getElementById('loading-screen');
          const root = document.getElementById('root');

          if (loadingScreen && root) {
            // Wait for React to render
            const checkForReactContent = () => {
              if (root.children.length > 0) {
                loadingScreen.classList.add('fade-out');
                root.classList.add('loaded');
                setTimeout(() => {
                  if (loadingScreen.parentNode) {
                    loadingScreen.parentNode.removeChild(loadingScreen);
                  }
                }, 300);
              } else {
                setTimeout(checkForReactContent, 100);
              }
            };

            setTimeout(checkForReactContent, 1000);
          }
        }, 500);
      });

      // Service Worker Registration (Optional)
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('%PUBLIC_URL%/sw.js')
            .then(function(registration) {
              console.log('SW registered: ', registration);
            })
            .catch(function(registrationError) {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>
